<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | منصة one23.sa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
            <h1 class="text-2xl font-extrabold text-blue-500 text-center mb-2">one23<span class="text-white">.sa</span></h1>
            <p class="text-gray-400 text-center text-sm mb-6">لوحة التحكم الإدارية وإدارة العملاء المحتملين</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-300">كلمة مرور الإدارة</label>
                    <input type="password" id="adminPassInput" placeholder="••••••••" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 text-left" dir="ltr" onkeypress="if(event.key==='Enter') loginAdmin()">
                </div>
                <button onclick="loginAdmin()" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3 rounded-xl transition">
                    دخول اللوحة
                </button>
            </div>
        </div>
    </div>

    <!-- واجهة لوحة التحكم الرئيسية -->
    <div id="dashboardScreen" class="hidden">
        <header class="bg-gray-900 border-b border-gray-800 px-6 py-4">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-2xl font-black text-blue-500">one23<span class="text-white">.sa</span></span>
                    <span class="bg-blue-500/10 text-blue-400 text-xs font-bold px-3 py-1 rounded-full border border-blue-500/30">لوحة الإدارة</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="fetchLeads()" class="bg-gray-800 hover:bg-gray-700 text-sm font-semibold px-4 py-2 rounded-xl transition">
                        تحديث البيانات ↻
                    </button>
                    <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-sm font-bold px-4 py-2 rounded-xl transition">
                        تصدير Excel (CSV) 📥
                    </button>
                    <button onclick="logoutAdmin()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 text-sm font-semibold px-4 py-2 rounded-xl transition">
                        خروج
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-6 space-y-6">
            <!-- بطاقات الإحصائيات وشريط البحث -->
            <div class="grid md:grid-cols-3 gap-4">
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl">
                    <p class="text-gray-400 text-xs mb-1">إجمالي الشركات المحللة</p>
                    <p id="totalLeadsCount" class="text-3xl font-black text-white">0</p>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl">
                    <p class="text-gray-400 text-xs mb-1">عملاء لديهم بريد إلكتروني</p>
                    <p id="emailLeadsCount" class="text-3xl font-black text-blue-400">0</p>
                </div>
                <div class="bg-gray-900 border border-gray-800 p-5 rounded-2xl flex items-center">
                    <input type="text" id="searchInput" onkeyup="filterLeads()" placeholder="ابحث برابط الشركة أو البريد الإلكتروني..." class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- جدول العملاء -->
            <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-gray-800/80 text-gray-300 border-b border-gray-700">
                            <tr>
                                <th class="p-4">التاريخ</th>
                                <th class="p-4">موقع الشركة</th>
                                <th class="p-4">البريد الإلكتروني</th>
                                <th class="p-4">الجمهور المستهدف</th>
                                <th class="p-4">تقييم العميل</th>
                                <th class="p-4">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="leadsTableBody" class="divide-y divide-gray-800">
                            <!-- تُملأ تلقائياً -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- نافذة عرض تفاصيل السيناريو والرسالة -->
    <div id="detailsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-700 max-w-2xl w-full rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-blue-400" dir="ltr"></h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold">✕</button>
            </div>
            <div>
                <strong class="text-xs text-gray-400 block mb-1">الرسالة التسويقية:</strong>
                <p id="modalMessage" class="text-sm bg-gray-800 p-3 rounded-xl leading-relaxed"></p>
            </div>
            <div>
                <strong class="text-xs text-gray-400 block mb-1">سيناريو الفيديو التفاعلي:</strong>
                <div id="modalScript" class="text-sm bg-gray-800 p-3 rounded-xl leading-relaxed space-y-2"></div>
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <a id="modalMailBtn" href="#" class="bg-blue-600 hover:bg-blue-700 text-sm font-bold px-4 py-2 rounded-xl transition">إرسال عرض عبر البريد ✉️</a>
                <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-2 rounded-xl transition">إغلاق</button>
            </div>
        </div>
    </div>

    <script>
        let allLeads = [];
        let adminPassword = sessionStorage.getItem('one23_admin_pass') || '';

        if (adminPassword) {
            fetchLeads();
        }

        async function loginAdmin() {
            const pass = document.getElementById('adminPassInput').value.trim();
            if (!pass) return;
            adminPassword = pass;
            await fetchLeads();
        }

        async function fetchLeads() {
            const btn = document.getElementById('loginBtn');
            if (btn) btn.innerText = 'جاري التحقق...';

            try {
                const res = await fetch('https://one23-platform.onrender.com/api/admin/leads', {
                    headers: { 'x-admin-password': adminPassword }
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    sessionStorage.setItem('one23_admin_pass', adminPassword);
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    allLeads = data.leads || [];
                    updateStats();
                    renderTable(allLeads);
                } else {
                    alert(data.detail || 'كلمة المرور غير صحيحة');
                    sessionStorage.removeItem('one23_admin_pass');
                }
            } catch (err) {
                alert('تعذر الاتصال بالخادم، انتظر ثواني وحاول مرة أخرى.');
            } finally {
                if (btn) btn.innerText = 'دخول اللوحة';
            }
        }

        function updateStats() {
            document.getElementById('totalLeadsCount').innerText = allLeads.length;
            const withEmail = allLeads.filter(l => l.email && l.email.trim() !== '').length;
            document.getElementById('emailLeadsCount').innerText = withEmail;
        }

        function renderTable(leads) {
            const tbody = document.getElementById('leadsTableBody');
            if (leads.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">لا توجد بيانات عملاء مسجلة بعد.</td></tr>';
                return;
            }

            tbody.innerHTML = leads.map((lead, index) => {
                const date = new Date(lead.created_at).toLocaleDateString('ar-SA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                const urlClean = lead.company_url.startsWith('http') ? lead.company_url : 'https://' + lead.company_url;
                return `
                    <tr class="hover:bg-gray-800/40 transition">
                        <td class="p-4 text-xs text-gray-400 whitespace-nowrap">${date}</td>
                        <td class="p-4 font-semibold text-blue-400" dir="ltr"><a href="${urlClean}" target="_blank" class="hover:underline">${lead.company_url}</a></td>
                        <td class="p-4 text-gray-300" dir="ltr">${lead.email || '<span class="text-gray-600">غير مسجل</span>'}</td>
                        <td class="p-4 text-xs text-gray-300 max-w-xs truncate">${lead.target_audience || ''}</td>
                        <td class="p-4 text-xs text-emerald-400 font-semibold max-w-xs truncate">${lead.lead_status || ''}</td>
                        <td class="p-4 whitespace-nowrap">
                            <button onclick="openDetails(${index})" class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-bold px-3 py-1.5 rounded-lg transition">
                                عرض السيناريو
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterLeads() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allLeads.filter(l => 
                (l.company_url && l.company_url.toLowerCase().includes(q)) ||
                (l.email && l.email.toLowerCase().includes(q))
            );
            renderTable(filtered);
        }

        function openDetails(index) {
            const lead = allLeads[index];
            document.getElementById('modalTitle').innerText = lead.company_url;
            document.getElementById('modalMessage').innerText = lead.marketing_message || '';
            
            const cleanScript = String(lead.video_script || '').replace(/\\n/g, '\n').split('\n').map(line => `<p>${line}</p>`).join('');
            document.getElementById('modalScript').innerHTML = cleanScript;

            const mailSubject = encodeURIComponent(`فكرة فيديو تعريفي مخصصة لشركتكم (${lead.company_url}) - منصة one23.sa`);
            const mailBody = encodeURIComponent(`السلام عليكم،\n\nقمنا بتحليل موقعكم (${lead.company_url}) وأعددنا لكم سيناريو فيديو تفاعلي مقترح:\n\n${lead.video_script}\n\nيسعدنا تواصلكم لتنفيذه،\nفريق one23.sa`);
            document.getElementById('modalMailBtn').href = `mailto:${lead.email || ''}?subject=${mailSubject}&body=${mailBody}`;

            document.getElementById('detailsModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.add('hidden');
        }

        function exportCSV() {
            if (allLeads.length === 0) return;
            const headers = ['ID', 'Date', 'Company URL', 'Email', 'Target Audience', 'Lead Status'];
            const rows = allLeads.map(l => [
                l.id,
                `"${l.created_at}"`,
                `"${l.company_url}"`,
                `"${l.email || ''}"`,
                `"${(l.target_audience || '').replace(/"/g, '""')}"`,
                `"${(l.lead_status || '').replace(/"/g, '""')}"`
            ]);
            const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `one23_leads_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }

        function logoutAdmin() {
            sessionStorage.removeItem('one23_admin_pass');
            location.reload();
        }
    </script>
</body>
</html>
