<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة one23 | توليد الحملات الذكية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-extrabold text-blue-500 mb-2 text-center">one23<span class="text-white">.sa</span></h1>
        <p class="text-gray-400 text-center mb-8 text-sm">منصة توليد وتحريك المحتوى الذكي للعملاء</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">رابط شركتك أو موقعك الإلكتروني</label>
                <input type="text" id="companyUrl" placeholder="https://example.com" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <button onclick="startCampaign()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30">
                ابدأ الحملة
            </button>
        </div>

        <div id="resultBox" class="mt-8 hidden bg-gray-800/50 border border-blue-500/30 rounded-xl p-6">
            <h3 class="text-lg font-bold text-blue-400 mb-3">نتائج تحليل الذكاء الاصطناعي:</h3>
            <p class="text-sm text-gray-300 mb-2"><strong>الجمهور المستهدف:</strong> <span id="resAudience"></span></p>
            <p class="text-sm text-gray-300 mb-2"><strong>الرسالة التسويقية:</strong> <span id="resMessage"></span></p>
            <p class="text-sm text-emerald-400 font-bold"><strong>حالة العميل:</strong> <span id="resStatus"></span></p>
        </div>
    </div>

    <script>
        async function startCampaign() {
            const urlInput = document.getElementById('companyUrl').value;
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');

            if (!urlInput) {
                alert('الرجاء إدخال الرابط أولاً');
                return;
            }

            btn.innerText = 'جاري التحليل وتوليد الحملة...';
            btn.disabled = true;

            try {
                // استبدل الرابط برابط السيرفر المحلي أو السحابي لاحقاً
                const response = await fetch('http://127.0.0.1:8000/api/generate-campaign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company_url: urlInput })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('resAudience').innerText = data.target_audience;
                    document.getElementById('resMessage').innerText = data.marketing_message;
                    document.getElementById('resStatus').innerText = data.lead_status;
                    resultBox.classList.remove('hidden');
                }
            } catch (error) {
                alert('حدث خطأ أثناء الاتصال بالخادم المحلي.');
            } finally {
                btn.innerText = 'ابدأ الحملة';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
