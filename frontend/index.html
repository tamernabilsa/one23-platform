<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة one23 | توليد وتحريك المحتوى الذكي للعملاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <h1 class="text-3xl font-extrabold text-blue-500 mb-2 text-center">one23<span class="text-white">.sa</span></h1>
        <p class="text-gray-400 text-center mb-8 text-sm">منصة توليد وتحريك المحتوى الذكي للعملاء (على غرار Explee)</p>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-2 text-gray-300">رابط شركتك أو موقعك الإلكتروني</label>
                <input type="text" id="companyUrl" placeholder="https://example.com" class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition text-left" dir="ltr">
            </div>
            <button onclick="startCampaign()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30">
                ابدأ الحملة
            </button>
        </div>

        <div id="resultBox" class="mt-8 hidden bg-gray-800/60 border border-blue-500/40 rounded-xl p-6 space-y-3">
            <h3 class="text-lg font-bold text-blue-400 border-b border-gray-700 pb-2">نتائج تحليل الذكاء الاصطناعي:</h3>
            
            <p class="text-sm text-gray-300 leading-relaxed">
                <strong class="text-white">الجمهور المستهدف:</strong> 
                <span id="resAudience"></span>
            </p>
            
            <p class="text-sm text-gray-300 leading-relaxed">
                <strong class="text-white">الرسالة التسويقية:</strong> 
                <span id="resMessage"></span>
            </p>
            
            <p class="text-sm text-gray-300 leading-relaxed">
                <strong class="text-white">فكرة الفيديو التفاعلي (Explee):</strong> 
                <span id="resScript"></span>
            </p>
            
            <p class="text-sm text-emerald-400 font-bold pt-2 border-t border-gray-700">
                <strong>حالة العميل:</strong> 
                <span id="resStatus"></span>
            </p>
        </div>
    </div>

    <script>
        async function startCampaign() {
            const urlInput = document.getElementById('companyUrl').value.trim();
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');

            if (!urlInput) {
                alert('الرجاء إدخال رابط الشركة أولاً');
                return;
            }

            btn.innerText = 'جاري تحليل الموقع وتوليد الحملة...';
            btn.disabled = true;
            resultBox.classList.add('hidden');

            try {
                const response = await fetch('https://one23-platform.onrender.com/api/generate-campaign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company_url: urlInput })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    document.getElementById('resAudience').innerText = data.target_audience;
                    document.getElementById('resMessage').innerText = data.marketing_message;
                    document.getElementById('resScript').innerText = data.video_script;
                    document.getElementById('resStatus').innerText = data.lead_status;
                    resultBox.classList.remove('hidden');
                } else {
                    alert(data.detail || 'حدث خطأ أثناء تحليل الموقع.');
                }
            } catch (error) {
                alert('تعذر الاتصال بالخادم السحابي، تأكد من اتصال الإنترنت أو انتظر ثواني حتى يستيقظ الخادم.');
            } finally {
                btn.innerText = 'ابدأ الحملة';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
